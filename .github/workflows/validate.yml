name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  validate-hacs:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - name: HACS validation
        uses: "hacs/action@main"
        with:
          category: "integration"
          # HACS currently downloads branch refs from raw.githubusercontent.com as
          # refs/heads/<branch>, which makes hacs.json and manifest checks fail
          # on branch pushes even when the files are valid. Hassfest covers the
          # integration manifest; keep HACS for repo-level checks.
          ignore: "brands hacsjson integration_manifest"
